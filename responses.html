<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Responses — Nadja & Julius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Shared tokens ── */
:root{
  --ink:#2E2420; --ink-soft:#8C7260; --muted:#8C7260;
  --paper:#FAF7F2; --cream:#E8DFD0; --cream-deep:#DDD0BC;
  --blue:#C4A882; --blue-deep:#A88B68;
  --line:rgba(46,36,32,.14); --line-soft:rgba(46,36,32,.08);
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --pad:clamp(1.25rem,5vw,4rem);
  --dur:.4s; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-weight:300;font-size:1rem;line-height:1.7;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;line-height:1.05;}
a{color:inherit;}

/* ── Password gate ── */
.gate{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:2rem var(--pad);background:var(--paper);
}
.gate-card{
  width:min(440px,100%);text-align:center;
  border:1px solid var(--line);padding:clamp(2.5rem,6vh,4rem) clamp(2rem,5vw,3rem);
}
.gate-mono{
  font-family:var(--font-display);font-weight:500;font-size:2rem;letter-spacing:.04em;
  margin-bottom:1.6rem;color:var(--ink);
}
.gate-mono .amp{font-style:italic;font-weight:400;padding:0 .12em;color:var(--blue);}
.gate-title{font-size:clamp(1.6rem,3.5vw,2.2rem);margin-bottom:.5rem;}
.gate-sub{font-size:.88rem;color:var(--ink-soft);margin:0 0 2rem;}
.gate-field{position:relative;margin-bottom:1.4rem;}
.gate-field input{
  width:100%;font-family:var(--font-sans);font-weight:300;font-size:1rem;color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:.7rem 0;text-align:center;letter-spacing:.1em;
  transition:border-color .25s;outline:none;
}
.gate-field input:focus{border-color:var(--blue);}
.gate-field input::placeholder{color:var(--muted);letter-spacing:.04em;}
.gate-btn{
  display:inline-block;width:100%;font-family:var(--font-sans);font-weight:400;
  font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;
  padding:1.05em 2em;border:1px solid var(--blue);color:var(--blue-deep);
  background:transparent;cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.gate-btn:hover{background:var(--blue);color:#fff;}
.gate-error{
  margin-top:1rem;font-size:.85rem;color:#9B4040;
  display:none;
}

/* ── Responses page ── */
.r-page{display:none;}

.r-head{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem var(--pad);
  background:rgba(250,247,242,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.r-head-mono{font-family:var(--font-display);font-weight:500;font-size:1.2rem;letter-spacing:.04em;}
.r-head-mono .amp{font-style:italic;font-weight:400;padding:0 .1em;color:var(--blue);}
.r-head-title{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.r-head-actions{display:flex;gap:.8rem;align-items:center;}
.r-btn-sm{
  font-family:var(--font-sans);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  padding:.6em 1.3em;border:1px solid var(--line);color:var(--ink-soft);
  background:transparent;cursor:pointer;transition:border-color .2s,color .2s;
}
.r-btn-sm:hover{border-color:var(--blue);color:var(--blue-deep);}

.r-main{max-width:1080px;margin:0 auto;padding:clamp(2.5rem,6vh,4rem) var(--pad);}

/* Summary cards */
.r-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;
  margin-bottom:clamp(2.5rem,5vh,3.5rem);
}
.r-sum-card{
  border:1px solid var(--line);padding:1.6rem 1.2rem;text-align:center;
}
.r-sum-num{
  font-family:var(--font-display);font-weight:500;
  font-size:clamp(2.4rem,5vw,3.6rem);line-height:1;color:var(--blue-deep);
}
.r-sum-label{margin-top:.5rem;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.r-sum-card.yes .r-sum-num{color:#4a7c59;}
.r-sum-card.no  .r-sum-num{color:#9B4040;}

/* State messages */
.r-state{text-align:center;padding:4rem 1rem;color:var(--ink-soft);}
.r-state-icon{font-size:2rem;margin-bottom:1rem;}

/* Table */
.r-table-wrap{overflow-x:auto;}
table.r-table{
  width:100%;border-collapse:collapse;
  font-size:.92rem;
}
.r-table th{
  font-family:var(--font-sans);font-size:.66rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);
  padding:.7rem 1rem;border-bottom:1px solid var(--line);
  text-align:left;font-weight:400;white-space:nowrap;
}
.r-table td{
  padding:.85rem 1rem;border-bottom:1px solid var(--line-soft);
  vertical-align:top;line-height:1.5;
}
.r-table tr:last-child td{border-bottom:none;}
.r-table tr:hover td{background:rgba(196,168,130,.06);}
.r-att-yes{color:#4a7c59;font-weight:400;}
.r-att-no {color:#9B4040;}
.r-att-badge{
  display:inline-block;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.2em .7em;border-radius:2px;
}
.r-att-badge.yes{background:rgba(74,124,89,.12);color:#3a6b48;}
.r-att-badge.no {background:rgba(155,64,64,.1);color:#8B3030;}
.r-empty{color:var(--muted);font-style:italic;}
.r-date{font-size:.8rem;color:var(--muted);}
.r-name{font-family:var(--font-display);font-size:1.05rem;font-weight:500;}

@media(max-width:600px){
  .r-summary{grid-template-columns:1fr 1fr;}
  .r-sum-card:last-child{grid-column:1/-1;}
  .r-table th:nth-child(n+4),
  .r-table td:nth-child(n+4){display:none;}
}
</style>
</head>
<body>

<!-- ── PASSWORD GATE ── -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mono">N<span class="amp">&amp;</span>J</div>
    <h1 class="gate-title">RSVP Responses</h1>
    <p class="gate-sub">10 June 2027 · Strand Deining</p>
    <div class="gate-field">
      <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
    </div>
    <button class="gate-btn" onclick="unlock()">View responses</button>
    <p class="gate-error" id="gate-error">Incorrect password. Try again.</p>
  </div>
</div>

<!-- ── RESPONSES VIEW ── -->
<div class="r-page" id="r-page">

  <header class="r-head">
    <div>
      <div class="r-head-mono">N<span class="amp">&amp;</span>J</div>
    </div>
    <div class="r-head-title">RSVP Responses</div>
    <div class="r-head-actions">
      <button class="r-btn-sm" onclick="downloadCSV()">Download CSV</button>
      <button class="r-btn-sm" onclick="location.reload()">Refresh</button>
    </div>
  </header>

  <main class="r-main">

    <!-- Summary cards -->
    <div class="r-summary" id="r-summary">
      <div class="r-sum-card yes"><div class="r-sum-num" id="count-yes">—</div><div class="r-sum-label">Attending</div></div>
      <div class="r-sum-card no"><div class="r-sum-num" id="count-no">—</div><div class="r-sum-label">Not attending</div></div>
      <div class="r-sum-card"><div class="r-sum-num" id="count-total">—</div><div class="r-sum-label">Total responses</div></div>
    </div>

    <!-- Loading / error / table -->
    <div id="r-state" class="r-state">
      <div class="r-state-icon">⏳</div>
      <p>Loading responses…</p>
    </div>

    <div id="r-table-wrap" class="r-table-wrap" style="display:none"></div>

  </main>
</div>

<script>
/* ─────────────────────────────────────────────
   CONFIG — change the password to whatever you like
   ───────────────────────────────────────────── */
const VIEWER_PASSWORD   = "NadjaJulius2027"; // ← change to whatever you like
const AIRTABLE_TOKEN    = "pat0emo2ZHxner9Cd.76a220e90bfb1916669a40dcb10e27311fc8ec170758dd83f1338aacee3ad058";
const AIRTABLE_ENDPOINT = "https://api.airtable.com/v0/appr0YjU7iNuaL2jD/tblQY2KGWlxkp2udj";
/* ─────────────────────────────────────────────
   END CONFIG
   ───────────────────────────────────────────── */

let allSubmissions = [];

function unlock(){
  const val = document.getElementById("pw").value;
  if(val === VIEWER_PASSWORD){
    document.getElementById("gate").style.display = "none";
    document.getElementById("r-page").style.display = "block";
    loadResponses();
  } else {
    document.getElementById("gate-error").style.display = "block";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}

async function loadResponses(){
  try{
    var allRecords = [];
    var offset = null;

    // Airtable paginates at 100 records — loop until done
    do {
      var url = AIRTABLE_ENDPOINT + "?sort[0][field]=Created+time&sort[0][direction]=asc";
      if(offset) url += "&offset=" + encodeURIComponent(offset);
      var res = await fetch(url, {
        headers:{ "Authorization":"Bearer " + AIRTABLE_TOKEN }
      });
      if(!res.ok) throw new Error("API error " + res.status);
      var data = await res.json();
      allRecords = allRecords.concat(data.records || []);
      offset = data.offset || null;
    } while(offset);

    allSubmissions = allRecords.map(function(r){
      var f = r.fields || {};
      return {
        id:     r.id          || "",
        date:   r.createdTime || "",
        names:  f.names  || "",
        attend: f.attend || "",
        diet:   f.diet   || "",
        part:   f.part   || "",
        notes:  f.notes  || ""
      };
    });

    renderSummary();
    renderTable(allSubmissions);

  } catch(err){
    document.getElementById("r-state").innerHTML =
      '<div class="r-state-icon">⚠️</div>' +
      '<p>Could not load responses.</p>' +
      '<p style="font-size:.85rem;color:var(--muted)">Make sure you\'re connected to the internet. If this keeps happening, check the Airtable token in responses.html.</p>' +
      '<p style="font-size:.8rem;color:var(--muted);margin-top:.5rem">Error: ' + err.message + '</p>';
  }
}

function renderSummary(){
  var yes   = allSubmissions.filter(function(s){ return s.attend === "yes"; }).length;
  var no    = allSubmissions.filter(function(s){ return s.attend === "no";  }).length;
  var total = allSubmissions.length;
  document.getElementById("count-yes").textContent   = yes;
  document.getElementById("count-no").textContent    = no;
  document.getElementById("count-total").textContent = total;
}

function renderTable(submissions){
  document.getElementById("r-state").style.display = "none";
  var wrap = document.getElementById("r-table-wrap");
  wrap.style.display = "block";

  if(submissions.length === 0){
    wrap.innerHTML = '<p class="r-state" style="padding:3rem 0">No responses yet.</p>';
    return;
  }

  var rows = submissions.map(function(s){
    var badge = s.attend === "yes"
      ? '<span class="r-att-badge yes">✓ Attending</span>'
      : s.attend === "no"
        ? '<span class="r-att-badge no">✗ Not attending</span>'
        : '<span class="r-empty">—</span>';
    var date = s.date ? new Date(s.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—";
    return "<tr>" +
      "<td><span class='r-name'>" + esc(s.names) + "</span></td>" +
      "<td>" + badge + "</td>" +
      "<td>" + (s.diet  ? esc(s.diet)  : "<span class='r-empty'>—</span>") + "</td>" +
      "<td>" + (s.part  ? esc(s.part)  : "<span class='r-empty'>—</span>") + "</td>" +
      "<td>" + (s.notes ? esc(s.notes) : "<span class='r-empty'>—</span>") + "</td>" +
      "<td><span class='r-date'>" + date + "</span></td>" +
      "</tr>";
  }).join("");

  wrap.innerHTML =
    "<table class='r-table'>" +
      "<thead><tr>" +
        "<th>Name(s)</th>" +
        "<th>Attending</th>" +
        "<th>Dietary</th>" +
        "<th>Contribution</th>" +
        "<th>Notes</th>" +
        "<th>Date</th>" +
      "</tr></thead>" +
      "<tbody>" + rows + "</tbody>" +
    "</table>";
}

function esc(str){
  return String(str||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function downloadCSV(){
  if(!allSubmissions.length){ alert("No responses to download yet."); return; }
  var header = ["Name(s)","Attending","Dietary","Contribution","Notes","Date"];
  var rows = allSubmissions.map(function(s){
    var date = s.date ? new Date(s.date).toLocaleDateString("en-GB") : "";
    return [s.names, s.attend, s.diet, s.part, s.notes, date].map(function(v){
      return '"' + String(v||"").replace(/"/g,'""') + '"';
    }).join(",");
  });
  var csv = [header.join(",")].concat(rows).join("\n");
  var a = document.createElement("a");
  a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
  a.download = "rsvp-responses.csv";
  a.click();
}
</script>

</body>
</html>
